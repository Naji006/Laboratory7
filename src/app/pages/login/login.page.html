
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Student Directory</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Student Login</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-input
          label="Student ID"
          labelPlacement="stacked"
          [(ngModel)]="studentId">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Password"
          type="password"
          labelPlacement="stacked"
          [(ngModel)]="password">
        </ion-input>
      </ion-item>

      <ion-text color="danger">
        <p>{{ message }}</p>
      </ion-text>

      <ion-button
        expand="block"
        (click)="login()"
        [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Log In' }}
      </ion-button>

      <ion-button
        expand="block"
        fill="clear"
        routerLink="/register">
        Create a new account
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
